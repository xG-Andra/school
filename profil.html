    <link rel="stylesheet" href="assets/style.css" />

  <body data-page="profil">
    <header class="site-header">
      <div class="container">
        <nav class="nav" aria-label="Navigasi utama">
          <a class="brand" href="index.html">
            <img class="brand-mark" src="images/Logo Yogyakarta.png" alt="Logo Yogyakarta" />
            <span class="font-jogja" style="color: #E20613 !important; font-size: 30px !important;">

          <button class="nav-toggle" type="button" aria-label="Buka menu">

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-title reveal">Profil Pembuat Website</h1>
          <p class="section-subtitle reveal">
            Halaman ini menampilkan identitas pembuat website.
          </p>
          <div class="profile-wrap" style="margin-top: 18px">
            <!-- Foto profil -->

            <div class="avatar reveal" aria-label="Foto profil">
              <!-- Placeholder aman: ganti dengan fotomu jika diperlukan -->

              <div class="initials" title="Ganti dengan foto profil">AA</div>
            </div>
            <div class="card profile-card reveal">
              <table class="table" aria-label="Data profil">
                <tbody>
                  <tr>
                    <th>Nama</th>
                    <td>Undefined</td>
                  </tr>
                  <tr>
                    <th>Gender</th>
                    <td>Undefined</td>
                  </tr>
                  <tr>
                    <th>Sekolah</th>
                    <td>Undefined</td>
                  </tr>
                  <tr>
                    <th>Kelas</th>
                    <td>Undefined</td>
                  </tr>
                  <tr>
                    <th>Hobi</th>
                    <td>Undefined</td>
                  </tr>
                  <tr>
                    <th>Skill</th>
                    <td>Undefined</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">

        <div>© <span id="year"></span> Company. All rights reserved.</div>
        <div><a href="index.html">Kembali ke Beranda</a></div>
